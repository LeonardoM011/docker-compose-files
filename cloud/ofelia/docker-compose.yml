# Shared job scheduler for the cloud stacks. Jobs are static [job-exec] sections
# in config.ini that target containers by name, not container labels.
services:
  ofelia:
    image: mcuadros/ofelia:0.3.21
    container_name: ofelia
    command: daemon --config=/etc/ofelia.conf
    env_file: ../common.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config.ini:/etc/ofelia.conf:ro
    restart: unless-stopped
    # No HTTP endpoint in 0.3.21, so the daemon process is all there is to check.
    healthcheck:
      test: ["CMD-SHELL", "pgrep ofelia >/dev/null"]
      interval: 60s
      start_interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
