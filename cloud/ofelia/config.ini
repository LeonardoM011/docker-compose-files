; Jobs run inside the named container via `docker exec`. The container is looked
; up by name on every run, so it may start after ofelia or be recreated; while it
; is missing, runs fail with "No such container" and are logged.
; Ofelia doesn't watch this file: `docker compose restart` here after editing.

[job-exec "paperless-export"]
schedule = 0 30 1 * * *
container = paperless-webserver-1
command = document_exporter ../export -d -c --no-progress-bar
no-overlap = true

[job-exec "vikunja-pgdump"]
schedule = 0 30 1 * * *
container = vikunja-db
; owner of ~/vikunja/backups on the VPS; as postgres (uid 999) the write is denied
user = 1000:1000
command = /usr/local/bin/pg-dump.sh
no-overlap = true
