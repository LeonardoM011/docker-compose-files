global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["172.30.0.1:9100"]
        labels: {instance: debian-lok-server}

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: docker-state
    static_configs:
      - targets: ["docker-state-exporter:8080"]
