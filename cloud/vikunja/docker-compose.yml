services:
  vikunja:
    image: vikunja/vikunja
    container_name: vikunja
    env_file: [.env, ../common.env]
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://debian-lok-server.tail81798e.ts.net/
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ./files:/app/vikunja/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: vikunja-db
    env_file: [.env, ../common.env]
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_DB: vikunja
    volumes:
      - vikunja-pgdata:/var/lib/postgresql
      - ./backups:/backups
      - ./backup/pg-dump.sh:/usr/local/bin/pg-dump.sh:ro  # run nightly by ../ofelia/config.ini
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikunja"]
      interval: 5s
      start_period: 30s

volumes:
  vikunja-pgdata:
