services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./data:/data
      - ./config:/config:ro
    tmpfs:
      - /tmp
